name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://tilmide.ma/api

      - name: Assemble deploy branch content
        run: |
          set -e
          rm -rf /tmp/deploy-out
          mkdir -p /tmp/deploy-out/dist /tmp/deploy-out/api

          cp -r dist/. /tmp/deploy-out/dist/

          # GitHub hard-rejects any pushed file over 100MB. Strip anything that
          # large from the deploy branch - it must already exist on the server
          # (e.g. uploaded once manually) since it can't change via this pipeline.
          echo "Files excluded from deploy branch for exceeding 50MB:"
          find /tmp/deploy-out/dist -type f -size +50M -print
          find /tmp/deploy-out/dist -type f -size +50M -delete

          cp server-php/index.php server-php/cors.php server-php/db.php \
             server-php/jwt.php server-php/config.php server-php/seed_admin.php \
             server-php/.htaccess /tmp/deploy-out/api/

          cp deploy-config/.cpanel.yml /tmp/deploy-out/.cpanel.yml

      - name: Publish to deploy branch
        run: |
          set -e
          cd /tmp/deploy-out
          git init -q
          git checkout -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin deploy

      - name: Trigger cPanel pull + deploy
        run: |
          EXEC="https://${{ secrets.CPANEL_HOST }}:2083/execute"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO="repository_root=${{ secrets.CPANEL_REPO_PATH }}"

          # The host's edge (WAF/bot-check) sometimes intercepts these calls with an
          # HTML "please wait, verifying your browser" page instead of forwarding to
          # cPanel - this happens intermittently, not on a fixed pattern, so retry
          # with backoff whenever the response isn't the JSON cPanel's UAPI returns.
          call_uapi () {
            local url="$1" label="$2" attempt resp body status
            for attempt in 1 2 3 4; do
              resp=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -H "$AUTH" "$url" || true)
              body="${resp%$'\n'HTTP_STATUS:*}"
              status="${resp##*HTTP_STATUS:}"
              if [[ "$body" == \{* ]]; then
                echo "$body"
                if [ "$status" != "200" ]; then
                  echo "::error::$label - HTTP $status"
                  return 1
                fi
                if echo "$body" | grep -q '"status":0'; then
                  echo "::error::$label - cPanel reported a logical failure"
                  return 1
                fi
                return 0
              fi
              echo "$label - attempt $attempt got a non-JSON response (likely a WAF/bot-check challenge page), retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            echo "::error::$label - never got a JSON response from cPanel after 4 attempts"
            return 1
          }

          echo "Pulling latest deploy branch into cPanel repo..."
          call_uapi "$EXEC/VersionControl/update?$REPO" "update" || exit 1

          # Deployment (.cpanel.yml) lives in a separate UAPI module from repo management.
          # Each deploy is a new "deployment" record - the function is create, not deploy.
          echo "Running .cpanel.yml deployment tasks..."
          call_uapi "$EXEC/VersionControlDeployment/create?$REPO" "deploy" || exit 1
